# SRS §25.2 — six-container topology (corrected from the source document's
# four-container list per Gap Analysis D-27: Redis and a queue worker are
# real dependencies of this stack, not optional additions).
#
# Health checks + `depends_on: condition: service_healthy` ensure app_laravel/
# queue_worker/reverb never start against a MySQL/Redis that's still booting
# (a real failure mode on a fresh `docker-compose up`, not a hypothetical one).
# `restart: unless-stopped` matches SRS DEP-x expectations for a
# self-managed VPS with no orchestrator (Kubernetes-style restart policies
# are out of scope — this is a single-VPS deployment, per §25.1).
services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app_laravel:
        condition: service_healthy
    networks: [msis]

  app_laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute=exit(0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [msis]

  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=5 --max-time=3600
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [msis]

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [msis]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: msis
      MYSQL_USER: msis
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — see .env.example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set — see .env.example}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [msis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [msis]

networks:
  msis:
    driver: bridge

volumes:
  mysql_data:
