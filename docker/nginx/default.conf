# SRS §25.3: TLS termination happens in front of this config in production
# (Let's Encrypt/certbot on the host, or a dedicated TLS-terminating LB) —
# this file defines the HTTP-level app routing shared by every environment.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 12M; # SRS §22 FILE-02: 10MB upload limit + multipart overhead

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app_laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
