<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nouvelle Intervention - MSIS Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#f3f3fb",

                      "on-secondary-fixed": "#1b1c1c",
                      "secondary-fixed-dim": "#c7c6c6",
                      "on-surface": "#1a1b21",
                      "secondary-container": "#e1dfdf",
                      "on-secondary-fixed-variant": "#464747",
                      "secondary": "#5e5e5e",
                      "primary-container": "#0d47a1",
                      "inverse-on-surface": "#f0f0f8",
                      "surface": "#faf8ff",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed-variant": "#005312",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#e4e2e2",
                      "inverse-surface": "#2e3036",
                      "on-primary-fixed": "#001945",
                      "tertiary-fixed-dim": "#88d982",
                      "on-primary": "#ffffff",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#a3f69c",
                      "primary-fixed-dim": "#b0c6ff",
                      "surface-bright": "#faf8ff",
                      "tertiary-container": "#005914",
                      "tertiary": "#003f0b",
                      "on-primary-container": "#a1bbff",
                      "on-background": "#1a1b21",

                      "surface-dim": "#d9d9e1",
                      "surface-container-highest": "#e2e2ea",
                      "on-surface-variant": "#434652",
                      "on-secondary-container": "#626262",
                      "outline": "#737783",
                      "on-tertiary-container": "#7ecf79",

                      "background": "#faf8ff",
                      "error-container": "#ffdad6",

              },
              "borderRadius": {

              },
              "spacing": {

                      "lg": "24px",
                      "margin-mobile": "16px",
                      "base": "4px",
                      "xs": "4px",
                      "md": "16px",
                      "2xl": "48px",
                      "xl": "32px",
                      "margin-desktop": "32px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "headline-md": ["Hanken Grotesk"],
                      "headline-lg-mobile": ["Hanken Grotesk"],
                      "headline-lg": ["Hanken Grotesk"],
                      "title-md": ["Inter"],
                      "label-md": ["JetBrains Mono"],
                      "label-lg": ["JetBrains Mono"],

                      "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}]

          },
        }
      </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
      </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 bg-surface flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full shrink-0 z-50 shadow-sm border-b border-surface-container-high md:border-none md:shadow-none">
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 text-on-surface">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Nouvelle Intervention</h1>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-mobile py-lg overflow-y-auto pb-32 md:px-margin-desktop">
<form class="space-y-xl" onsubmit="event.preventDefault(); alert('Ticket Created');">
<!-- Section: Title -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="ticket-title">Titre de l'intervention</label>
<div class="relative">
<input class="block w-full rounded-lg border border-outline-variant bg-surface px-md py-sm text-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="ticket-title" name="ticket-title" placeholder="Ex: Panne serveur principal" required="" type="text"/>
</div>
</div>
<!-- Section: Description -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="ticket-description">Description détaillée</label>
<div class="relative">
<textarea class="block w-full rounded-lg border border-outline-variant bg-surface px-md py-sm text-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors resize-y" id="ticket-description" name="ticket-description" placeholder="Décrivez le problème rencontré, les symptômes, etc..." required="" rows="5"></textarea>
</div>
</div>
<!-- Section: Priority -->
<div class="space-y-md">
<label class="block font-label-lg text-label-lg text-on-surface">Priorité</label>
<div class="grid grid-cols-3 gap-md">
<!-- Low -->
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="rounded-xl border border-outline-variant bg-surface px-md py-sm text-center transition-all peer-checked:bg-tertiary-fixed peer-checked:border-tertiary-container peer-checked:text-tertiary-container hover:bg-surface-container-low min-h-[48px] flex items-center justify-center">
<span class="font-title-md text-title-md">Basse</span>
</div>
</label>
<!-- Normal -->
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="normal"/>
<div class="rounded-xl border border-outline-variant bg-surface px-md py-sm text-center transition-all peer-checked:bg-amber-100 peer-checked:border-amber-700 peer-checked:text-amber-900 hover:bg-surface-container-low min-h-[48px] flex items-center justify-center">
<span class="font-title-md text-title-md">Normale</span>
</div>
</label>
<!-- High -->
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="rounded-xl border border-outline-variant bg-surface px-md py-sm text-center transition-all peer-checked:bg-error-container peer-checked:border-error peer-checked:text-on-error-container hover:bg-surface-container-low min-h-[48px] flex items-center justify-center">
<span class="font-title-md text-title-md">Haute</span>
</div>
</label>
</div>
</div>
<!-- Section: Attachments -->
<div class="space-y-md">
<label class="block font-label-lg text-label-lg text-on-surface">Pièces jointes (Photos / Documents)</label>
<div class="grid grid-cols-2 gap-md md:grid-cols-4">
<!-- Add Photo Button -->
<button class="flex flex-col items-center justify-center gap-sm rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low p-md hover:bg-surface-container-high transition-colors min-h-[120px] active:scale-95 duration-100 text-primary-container" type="button">
<span class="material-symbols-outlined text-[32px]">photo_camera</span>
<span class="font-label-md text-label-md text-on-surface-variant">Prendre photo</span>
</button>
<!-- Add from Gallery Button -->
<button class="flex flex-col items-center justify-center gap-sm rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low p-md hover:bg-surface-container-high transition-colors min-h-[120px] active:scale-95 duration-100 text-primary-container" type="button">
<span class="material-symbols-outlined text-[32px]">image</span>
<span class="font-label-md text-label-md text-on-surface-variant">Galerie</span>
</button>
</div>
</div>
<!-- Submit Button (Fixed at bottom on mobile, inline on desktop) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container p-margin-mobile shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:static md:bg-transparent md:shadow-none md:p-0 md:pt-lg z-40">
<button class="w-full rounded-xl bg-primary-container py-md px-lg font-title-lg text-title-lg text-on-primary hover:bg-primary transition-colors active:scale-95 duration-100 min-h-[48px] flex items-center justify-center gap-sm shadow-md" type="submit">
<span class="material-symbols-outlined">add_task</span>
                    Créer le Ticket
                </button>
</div>
</form>
</main>
<!-- Suppressed BottomNav - Transactional Screen -->
</body></html>
