<body class="bg-background min-h-screen text-on-background pb-24 md:pb-0 font-body-md text-body-md">
<!-- TopAppBar -->
<header class="bg-surface flex items-center justify-between px-margin-mobile h-16 w-full sticky top-0 z-50">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="hub">hub</span>
</div>
<h1 class="font-display-lg text-headline-md text-primary tracking-tight">MSIS Tracking</h1>
</div>
<button class="text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-100 p-sm rounded-full flex items-center justify-center w-12 h-12">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
</button>

<div class="mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Superviseur</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Vue d'ensemble des opérations techniques.</p>
</div>

<button class="px-lg py-sm font-title-md text-title-md text-primary border-b-2 border-primary whitespace-nowrap">Interventions</button>
<button class="px-lg py-sm font-title-md text-title-md text-on-surface-variant hover:text-primary transition-colors whitespace-nowrap">Utilisateurs</button>
<button class="px-lg py-sm font-title-md text-title-md text-on-surface-variant hover:text-primary transition-colors whitespace-nowrap">Rapports</button>
</nav>
<!-- KPI Widgets (Empty State) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter mb-2xl">
<!-- KPI 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:border-primary transition-colors">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Nouvelles</span>
<span class="material-symbols-outlined text-outline" data-icon="fiber_new">fiber_new</span>
</div>
<div class="font-display-lg text-display-lg text-on-surface mt-auto leading-none">0</div>
</div>
<!-- KPI 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:border-primary transition-colors">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">En cours</span>
<span class="material-symbols-outlined text-outline" data-icon="pending">pending</span>
</div>
<div class="font-display-lg text-display-lg text-on-surface mt-auto leading-none">0</div>
</div>
<!-- KPI 3 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:border-primary transition-colors">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Critiques</span>
<span class="material-symbols-outlined text-error" data-icon="warning">warning</span>
</div>
<div class="font-display-lg text-display-lg text-on-surface mt-auto leading-none">0</div>
</div>
<!-- KPI 4 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:border-primary transition-colors">
<div class="flex items-center justify-between">

<span class="material-symbols-outlined text-outline" data-icon="task_alt">task_alt</span>

<div class="font-display-lg text-display-lg text-on-surface mt-auto leading-none">0</div>
