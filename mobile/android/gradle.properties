# Xmx8G (the Android Studio template default) OOM-crashed the Gradle daemon
# on this machine — only ~0.5G was free system-wide alongside Docker/VS
# Code/etc. Capped to something that actually fits.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on F: while the pub-cache/Gradle caches live on C:.
# Kotlin's incremental compiler tries to relativize paths between the two
# and fails ("this and base files have different roots"), which cascades
# into lock-file thrashing and spurious "device is not ready" I/O errors.
# Incremental compilation isn't needed for a debug run, so disable it.
kotlin.incremental=false
